!
hostname ospfd
password ospfd
enable password ospfd
log stdout
!
! LAN: se anuncian en el area 0, sin costo (usan el default)
interface eth0
 ip ospf cost 23
 ip ospf area 0.0.0.0
!
interface eth1
 ip ospf cost 27
 ip ospf area 0.0.0.0
!
! Enlaces: costo de SALIR por esa interfaz
interface eth2
 ip ospf cost 33
 ip ospf area 0.0.0.0
!
interface eth3
 ip ospf area 0.0.0.0
!
interface lo
!
router ospf
!
line vty
!
